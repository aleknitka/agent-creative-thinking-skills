name: validate

on:
  pull_request:
  push:
    branches: [master, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pyyaml 2>&1 | tail -n 5
      - run: python scripts/validate.py
